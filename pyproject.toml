[project]
name = "xiaoyuzhou"
version = "0.1.0"
description = "Xiaoyuzhou FM CLI — agent-friendly, composable, clean."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
xyz = "xiaoyuzhou.cli:main"
xiaoyuzhou = "xiaoyuzhou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xiaoyuzhou"]
